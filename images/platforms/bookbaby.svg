<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="26" fill="#5E17EB"/>
  <!-- BookBaby iconic modern monogram / stylized open book with baby blocks in cyan & gold -->
  <g transform="translate(20, 22)">
    <!-- Book wings -->
    <path fill="#00D2FF" d="M38,4 C24,4 12,12 6,24 L6,54 C12,46 22,42 38,42 L38,4 Z"/>
    <path fill="#FFD200" d="M42,4 C56,4 68,12 74,24 L74,54 C68,46 58,42 42,42 L42,4 Z"/>
    <!-- Heart / pages center -->
    <path fill="#FFFFFF" d="M40,22 C34,14 22,14 16,22 C10,30 20,44 40,56 C60,44 70,30 64,22 C58,14 46,14 40,22 Z"/>
  </g>
  <!-- "BookBaby" wordmark underneath in clean white -->
  <text x="60" y="100" font-family="'Poppins', -apple-system, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">BookBaby</text>
</svg>